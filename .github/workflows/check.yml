# SPDX-License-Identifier: MIT
#
# Runs on x86_64-linux and aarch64-linux: the flake's checks (the
# sandboxed conformance checks, the unit tests, the fixtures, Lobsters and
# the formatting), then each conformance check of the nix-purifiers
# contract that needs the network or Nix itself, and the publish test, as
# jobs of the same names (tests/ci).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  ci-script:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        job: [conformance-relock, conformance-rebuild, conformance-offline, conformance-update, publish]
    name: ${{ matrix.job }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: tests/ci/${{ matrix.job }}.sh

  composition:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/composition-native.py

      - name: Historical Ruby and Bundler native composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          mapfile -t historical < <(nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.historical-ruby-cli \
            .#checks.x86_64-linux.historical-ruby-tools \
            .#checks.x86_64-linux.historical-ruby-repository \
            .#checks.x86_64-linux.historical-ruby-release)
          python3 tests/historical-native.py "${historical[@]}"

          mapfile -t ruby18 < <(nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.ruby18-cli \
            .#checks.x86_64-linux.ruby18-sdk \
            .#checks.x86_64-linux.ruby18-repository \
            .#checks.x86_64-linux.ruby18-release)
          python3 tests/historical-native.py "${ruby18[@]}" 1.8.7 ruby18
          update=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-rubygems-update)
          python3 tests/ruby18-incoming-native.py "${ruby18[0]}" "${ruby18[1]}" \
            --rubygems-update-archive "$update" \
            --results "$RUNNER_TEMP/ruby18-incoming-evidence"

      - name: Exercise earlier native Bundler resolver epochs
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          for epoch in 09 10 110 116 136; do
            update=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-rubygems-update)
            extra=(--rubygems-update-archive "$update")
            case "$epoch" in
              09)
                version=0.9.26; hash='sha256-z6SzCdAFdRtD3P7HtWmCn6o44bXjMnR6d+uX/3wca0E='
                git_prefetch=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-git-prefetch)
                update=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-bundler10-rubygems-update)
                extra=(--versionless --rubygems-version 1.8.30 --no-ruby-dsl --yaml-sdk --git-source --prefetch-git "$git_prefetch/bin/nix-prefetch-git" --rubygems-update-archive "$update")
                ;;
              10)
                version=1.0.22; hash='sha256-wOcoWqMSJAdHs6Ox3ll4agSVCkJA7GyWudDv3VjU7EM='
                higher=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-bundler117-gems)
                update=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-bundler10-rubygems-update)
                extra=(--versionless --extra-gem-path "$higher/gems" --rubygems-version 1.8.30 --no-ruby-dsl --rubygems-update-archive "$update")
                ;;
              110) version=1.10.6; hash='sha256-+ykz0SMEzsddrHW5OhywRdoCaykebGWwl0TOuQB2n+4=' ;;
              116) version=1.16.6; hash='sha256-B7RF6pjTkDLSVwFqlxoMCUdVbup4Vc5klw2iqC4JhgU=' ;;
              136)
                version=1.3.6; hash='sha256-K6aoziNnsuOCuWkeb7qAidtAu0u4gFTe0a3yYWy6El8='
                higher=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-bundler117-gems)
                extra+=(--versionless --extra-gem-path "$higher/gems")
                ;;
            esac
            mapfile -t sdk < <(nix build --no-link --print-out-paths \
              ".#checks.x86_64-linux.ruby18-bundler${epoch}-cli" \
              ".#checks.x86_64-linux.ruby18-bundler${epoch}-sdk")
            python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
              --bundler-version "$version" --bundler-hash "$hash" \
              --sdk-check "ruby18-bundler${epoch}-sdk" "${extra[@]}" \
              --results "$RUNNER_TEMP/ruby18-incoming-${epoch}-evidence"
          done

      - name: Ruby 1.9, 2.0 and 2.1 native incoming composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          update=$(nix build --no-link --print-out-paths .#checks.x86_64-linux.ruby18-rubygems-update)
          for point in 19 20 21; do
            case "$point" in
              19) version=1.9.3; patchlevel=547 ;;
              20) version=2.0.0; patchlevel=481 ;;
              21) version=2.1.3; patchlevel=242 ;;
            esac
            mapfile -t sdk < <(nix build --no-link --print-out-paths \
              ".#checks.x86_64-linux.ruby${point}-cli" \
              ".#checks.x86_64-linux.ruby${point}-sdk")
            python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
              --ruby-version "$version" --ruby-patchlevel "$patchlevel" \
              --sdk-check "ruby${point}-sdk" --provider-check "ruby${point}-app" \
              --rubygems-update-archive "$update" \
              --results "$RUNNER_TEMP/ruby${point}-incoming-evidence"
          done

      - name: Retain historical incoming composition receipts
        if: always() && runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruby18-incoming-composition
          path: |
            ${{ runner.temp }}/ruby18-incoming*-evidence/receipt.json
            ${{ runner.temp }}/ruby18-incoming*-evidence/logs/*
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer/Gemfile
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer/Gemfile.lock
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer/bundler-purifier.lock.json
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer/incoming_consumer.gemspec
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer/lib/incoming_consumer.rb
            ${{ runner.temp }}/ruby18-incoming*-evidence/consumer.nix
            ${{ runner.temp }}/ruby19-incoming-evidence/receipt.json
            ${{ runner.temp }}/ruby19-incoming-evidence/logs/*
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer/Gemfile
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer/Gemfile.lock
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer/bundler-purifier.lock.json
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer/incoming_consumer.gemspec
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer/lib/incoming_consumer.rb
            ${{ runner.temp }}/ruby19-incoming-evidence/consumer.nix
            ${{ runner.temp }}/ruby20-incoming-evidence/receipt.json
            ${{ runner.temp }}/ruby20-incoming-evidence/logs/*
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer/Gemfile
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer/Gemfile.lock
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer/bundler-purifier.lock.json
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer/incoming_consumer.gemspec
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer/lib/incoming_consumer.rb
            ${{ runner.temp }}/ruby20-incoming-evidence/consumer.nix
            ${{ runner.temp }}/ruby21-incoming-evidence/receipt.json
            ${{ runner.temp }}/ruby21-incoming-evidence/logs/*
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer/Gemfile
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer/Gemfile.lock
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer/bundler-purifier.lock.json
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer/incoming_consumer.gemspec
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer/lib/incoming_consumer.rb
            ${{ runner.temp }}/ruby21-incoming-evidence/consumer.nix
          if-no-files-found: ignore
