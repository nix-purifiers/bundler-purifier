          done

      - name: Ruby 4.0 and Bundler 4 native incoming composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          mapfile -t sdk < <(nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.ruby40-cli \
            .#checks.x86_64-linux.ruby40-sdk)
          python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
            --ruby-version 4.0.9 --ruby-patchlevel 0 --rubygems-version 3.7.2 \
            --bundler-version 4.0.20 --bundler-hash 'sha256-eXiorGSHZ/XmNbxSJEW3noClK5B6OaNsLYCF7WvHYq4=' \
            --sdk-check ruby40-sdk --provider-check ruby40-app \
            --results "$RUNNER_TEMP/ruby40-incoming-evidence"

      - name: Ruby 4.1 preview and Bundler beta native incoming composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          mapfile -t sdk < <(nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.ruby41-cli \
            .#checks.x86_64-linux.ruby41-sdk)
          python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
            --ruby-version 4.1.0 --ruby-patchlevel -1 --ruby-requirement 4.1.0.preview1 \
            --rubygems-version 4.1.0.beta2 --bundler-version 4.1.0.beta2 \
            --bundler-hash 'sha256-/9gMJE48CAy8QDsZTns4ZmjGknVWH4G3qAHwh3Km4tY=' \
            --sdk-check ruby41-sdk --provider-check ruby41-app \
            --results "$RUNNER_TEMP/ruby41-incoming-evidence"

      - name: Retain historical incoming composition receipts
        if: always() && runner.os == 'Linux' && runner.arch == 'X64'
