              26) version=2.6.6; patchlevel=146; bundler=1.17.2; hash='sha256-uVQDjiLiMsyU/rMjGH5CGUtO1uFqFxKzflvWAY7BdjU=' ;;
              27) version=2.7.1; patchlevel=83; bundler=2.1.4; hash='sha256-UAFNIdZxIHnaTWRk3hK7k8J4+HySANC2C6mfMsJa9Ik=' ;;
            esac
            mapfile -t sdk < <(nix build --no-link --print-out-paths \
              ".#checks.x86_64-linux.ruby${point}-cli" \
              ".#checks.x86_64-linux.ruby${point}-sdk")
            python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
              --ruby-version "$version" --ruby-patchlevel "$patchlevel" \
              --rubygems-version 3.1.2 --bundler-version "$bundler" --bundler-hash "$hash" \
              --sdk-check "ruby${point}-sdk" --provider-check "ruby${point}-app" \
              --rubygems-update-archive "$update" \
              --results "$RUNNER_TEMP/ruby${point}-incoming-evidence"
          done

      - name: Ruby 3.0 through 3.3 native incoming composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          for point in 30 31 32 33; do
            case "$point" in
              30) version=3.0.5; patchlevel=211; gems=3.3.20; bundler=2.2.33; hash='sha256-Cm/U2w09kjIFPRXx2QYnKbqGuuZnNn2iUGtgCiT3BlQ=' ;;
              31) version=3.1.7; patchlevel=261; gems=3.5.22; bundler=2.3.27; hash='sha256-3eSCBFNQLmy6VXI9E3bM1tLaBJp7u5IuPnNVzHYBA0s=' ;;
              32) version=3.2.8; patchlevel=263; gems=3.5.22; bundler=2.4.19; hash='sha256-M03HlkODhHMv3xm/ovYjdTt+2FFg0Izh8gAJmEzvs2I=' ;;
              33) version=3.3.8; patchlevel=144; gems=3.5.22; bundler=2.5.22; hash='sha256-dj8w1ZjuWHQu6ikoWHVDXqciIY1N8UneNbzjfALOlo4=' ;;
            esac
            mapfile -t sdk < <(nix build --no-link --print-out-paths \
              ".#checks.x86_64-linux.ruby${point}-cli" \
              ".#checks.x86_64-linux.ruby${point}-sdk")
            python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
