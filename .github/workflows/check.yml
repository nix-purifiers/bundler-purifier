          python3 tests/ruby18-incoming-native.py "${sdk[0]}" "${sdk[1]}" \
            --ruby-version 2.3.6 --ruby-patchlevel 384 --rubygems-version 2.7.6 \
            --bundler-version 2.0.2 --bundler-hash 'sha256-TCrh/OigcrgyrHGI8eUwp8/48KadipYhsy0UB9sAotA=' \
            --sdk-check ruby23-bundler20-sdk --provider-check ruby23-bundler20-app \
            --rubygems-update-archive "$update" \
            --results "$RUNNER_TEMP/ruby23-bundler20-incoming-evidence"

      - name: Ruby 2.3 with Bundler 2.3 native incoming composition
        if: runner.os == 'Linux' && runner.arch == 'X64'
